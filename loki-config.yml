auth_enabled: false

server:
  http_listen_port: 3100
  log_level: info

# Single-process Loki: rings must not use Consul (default KV) — nothing listens on :8500.
# inmemory is correct for one replica; use memberlist/etcd/consul only when clustering.
common:
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

ingester:
  chunk_idle_period: 5m
  chunk_retain_period: 30s
  max_chunk_age: 1h
  # Default WAL dir is /wal (root); non-root Loki user gets "permission denied". Keep WAL on the mounted volume.
  wal:
    dir: /loki/wal


schema_config:
  configs:
    - from: 2026-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  boltdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/cache
  filesystem:
    directory: /loki/chunks

compactor:
  working_directory: /loki/compactor

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 24h
  allow_structured_metadata: false
